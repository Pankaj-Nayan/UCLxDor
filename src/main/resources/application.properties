spring.application.name=Ballondor
spring.datasource.url=jdbc:mysql://localhost:3306/ballondor
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
football.api.base-url=${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
football.api.key=${FOOTBALL_API_KEY:}
football.api.competition-id=${FOOTBALL_COMPETITION_ID:2}
football.api.season=${FOOTBALL_API_SEASON:2024}
football.api.max-pages=${FOOTBALL_API_MAX_PAGES:100}
football.prediction.softmax-temperature=${PREDICTION_SOFTMAX_TEMPERATURE:12.0}
