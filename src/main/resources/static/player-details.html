<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player profile | UCL Ballon d'Or Predictor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Player profile</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Dashboard</a>
            <a href="players.html">Player search</a>
            <a href="compare.html">Compare players</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="predictions.html">Predictions</a>
        </nav>
    </header>
    <main>
        <p><a href="players.html">Return to player search</a></p>
        <section aria-labelledby="profile-heading">
            <h2 id="profile-heading">Player information</h2>
            <p id="profile-status" role="status" aria-live="polite">Loading player profile…</p>
            <div id="player-profile"></div>
        </section>
        <section aria-labelledby="season-heading">
            <h2 id="season-heading">Season statistics</h2>
            <label for="profile-season">Season</label>
            <select id="profile-season" disabled></select>
            <p id="statistics-status" role="status" aria-live="polite">Loading available seasons…</p>
            <dl id="player-statistics"></dl>
        </section>
        <section aria-labelledby="prediction-heading">
            <h2 id="prediction-heading">Predicted Ballon d'Or winning percentage</h2>
            <p id="prediction-status" role="status" aria-live="polite">Select a season to load the model estimate.</p>
            <div id="player-prediction"></div>
        </section>
    </main>
    <script type="module" src="js/player-details.js"></script>
</body>
</html>
